services:
  - type: web
    name: carinfo-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        value: "594206475"
      - key: DATA_DIR
        value: /data
    healthCheckPath: /
    disk:
      name: carinfo-data
      mountPath: /data
      sizeGB: 1
