<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760">
  <defs>
    <pattern id="sp" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45 480 380)">
      <rect width="20" height="40" fill="#cc1111"/>
      <rect x="20" width="20" height="40" fill="#1a2870"/>
    </pattern>
    <clipPath id="ov">
      <polygon points="370,380 480,270 590,380 480,490"/>
    </clipPath>
    <clipPath id="ld">
      <rect x="112" y="182" width="396" height="396" rx="40" transform="rotate(45 310 380)"/>
    </clipPath>
    <clipPath id="rd">
      <rect x="452" y="182" width="396" height="396" rx="40" transform="rotate(45 650 380)"/>
    </clipPath>
  </defs>

  <!-- Left red diamond -->
  <rect x="112" y="182" width="396" height="396" rx="40" transform="rotate(45 310 380)" fill="#dd1212"/>

  <!-- Right blue diamond -->
  <rect x="452" y="182" width="396" height="396" rx="40" transform="rotate(45 650 380)" fill="#1a2870"/>

  <!-- Diagonal stripes in overlap -->
  <rect x="0" y="0" width="960" height="760" fill="url(#sp)" clip-path="url(#ov)"/>

  <!-- White text -->
  <text x="480" y="430" text-anchor="middle" fill="white"
        font-size="158" font-family="Arial Black,Impact,Arial,sans-serif"
        font-weight="900" font-style="italic">ישראכרט</text>
</svg>
